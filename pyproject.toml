[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "blt"
version = "0.1.0"
description = "Book Listing Automation"
requires-python = ">=3.10"
dependencies = [
    "typer>=0.15,<1.0",
    "rich==13.7.1",
    "python-dotenv==1.2.2",
    "pydantic==2.13.4",
    "pydantic-settings==2.4.0",
    "SQLAlchemy==2.0.32",
    "Pillow>=11.1.0",
    "requests==2.32.3",
    "pillow-heif>=1.1.0",
    "imageio-ffmpeg==0.4.9",
    "pyzbar>=0.1.9",
    "beautifulsoup4>=4.12.0",
    "fastapi==0.139.2",
    "uvicorn[standard]==0.51.0",
    "jinja2==3.1.6",
    "python-multipart==0.0.32",
]

[project.scripts]
blt = "blt.cli:app"

[tool.setuptools]
package-dir = {"" = "src"}
packages = ["blt"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.coverage.run]
source = ["blt"]

[tool.coverage.report]
fail_under = 80

[tool.uv]
dev-dependencies = [
    "httpx>=0.28.1",
    "mypy>=2.3.0",
    "pre-commit>=4.6.1",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "python-barcode>=0.16.1",
    "ruff>=0.16.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "W"]

[tool.mypy]
python_version = "3.10"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
check_untyped_defs = true
